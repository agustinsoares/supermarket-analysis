name: Supabase keep-alive

# El plan gratuito de Supabase pausa el proyecto tras ~7 días sin actividad.
# Este workflow lanza una consulta ligera contra la API cada 3 días para mantenerlo activo.
# Requiere el secret SUPABASE_ANON_KEY (clave anon/publishable, Settings > API).

on:
  schedule:
    - cron: "43 7 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la base de datos
        env:
          SUPABASE_URL: https://pcobacltecgcexjdygpv.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Falta el secret SUPABASE_ANON_KEY"; exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/flyers?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
